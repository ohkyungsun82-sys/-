<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동아리 작품 공유 플랫폼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <!-- [추가] Three.js 및 3D 모델 로더 (GLTFLoader, OrbitControls) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <!-- 상단 네비게이션 -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-cyan-400">🎮 동아리 작품 공유소</h1>
        <div class="flex items-center gap-4">
            <div id="logged-out" class="flex gap-2">
                <button onclick="openLoginModal()" class="px-4 py-1.5 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold rounded text-sm transition">로그인 / 회원가입</button>
            </div>
            <div id="logged-in" class="hidden flex items-center gap-4">
                <div id="user-profile-badge" class="flex items-center gap-2 cursor-pointer" onclick="openProfileModal()" title="프로필 수정">
                    <img id="user-avatar" src="" class="w-8 h-8 rounded-full object-cover border border-cyan-400">
                    <span id="user-welcome" class="text-sm font-medium text-slate-300"></span>
                </div>
                <button onclick="handleLogout()" class="px-3 py-1.5 bg-red-500/20 text-red-400 hover:bg-red-500/30 rounded text-sm transition">로그아웃</button>
            </div>
        </div>
    </header>

    <!-- 메인 레이아웃 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-4 gap-6">
        <!-- 업로드 폼 -->
        <section class="bg-slate-800 p-5 rounded-xl border border-slate-700 h-fit">
            <h2 class="text-lg font-semibold mb-4 text-cyan-300">작품 업로드</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">제목</label>
                    <input type="text" id="post-title" placeholder="예: 로블록스 무기 모델링" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded text-sm text-white focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">설명</label>
                    <textarea id="post-desc" rows="3" placeholder="블렌더로 제작한 작품입니다." class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded text-sm text-white focus:outline-none focus:border-cyan-400 resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">대표 사진 파일</label>
                    <input type="file" id="post-img" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-cyan-500/20 file:text-cyan-300 hover:file:bg-cyan-500/35 cursor-pointer">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">3D 모델 파일 (.glb / .gltf)</label>
                    <input type="file" id="post-model" accept=".glb,.gltf" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-indigo-500/20 file:text-indigo-300 hover:file:bg-indigo-500/35 cursor-pointer">
                </div>
                <button onclick="createPost()" class="w-full py-2.5 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold rounded text-sm transition">공유하기</button>
            </div>
        </section>

        <!-- 피드 목록 -->
        <section class="md:col-span-2 space-y-4">
            <h2 class="text-lg font-semibold text-cyan-300">동아리원 피드</h2>
            <div id="feed-container" class="space-y-4">
                <!-- 게시글 동적 생성 -->
            </div>
        </section>

        <!-- 우측 사이드바: 닉네임 관리 -->
        <aside class="bg-slate-800 p-5 rounded-xl border border-slate-700 h-fit space-y-4">
            <h2 class="text-lg font-semibold text-cyan-300">동아리원 목록</h2>
            <div id="user-list-container" class="space-y-2 max-h-[500px] overflow-y-auto">
                <!-- 닉네임 목록 -->
            </div>
        </aside>
    </main>

    <!-- 로그인/회원가입 모달 -->
    <div id="login-modal" class="fixed inset-0 bg-black/70 flex justify-center items-center hidden z-50">
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 w-96 space-y-4 relative">
            <h2 class="text-xl font-bold text-cyan-400 text-center">로그인 및 회원가입</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">닉네임</label>
                    <input type="text" id="modal-username" placeholder="사용할 닉네임" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded text-sm text-white focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">비밀번호</label>
                    <input type="password" id="modal-password" placeholder="비밀번호" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded text-sm text-white focus:outline-none focus:border-cyan-400">
                </div>
                <button onclick="handleLogin()" class="w-full py-2.5 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold rounded text-sm transition">확인</button>
            </div>
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-sm">✕</button>
        </div>
    </div>

    <!-- 프로필 수정 모달 -->
    <div id="profile-modal" class="fixed inset-0 bg-black/70 flex justify-center items-center hidden z-50">
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 w-96 space-y-4 relative">
            <h2 class="text-xl font-bold text-cyan-400 text-center">프로필 설정</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">프로필 이미지 선택</label>
                    <input type="file" id="profile-img-input" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-cyan-500/20 file:text-cyan-300 hover:file:bg-cyan-500/35 cursor-pointer">
                </div>
                <button onclick="updateProfile()" class="w-full py-2.5 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold rounded text-sm transition">프로필 변경</button>
            </div>
            <button onclick="closeProfileModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-sm">✕</button>
        </div>
    </div>

    <!-- 자바스크립트 및 소켓 연동 -->
    <script>
        const socket = io();
        let currentUser = JSON.parse(localStorage.getItem('club_user_obj')) || null;

        window.onload = () => {
            initAuthView();
            fetchInitialData();
        };

        socket.on('update_posts', (posts) => {
            renderFeed(posts);
        });

        socket.on('update_users', (users) => {
            renderUserList(users);
        });

        socket.on('force_logout', (deletedUsername) => {
            if (currentUser && currentUser.username === deletedUsername) {
                alert('관리자에 의해 계정이 삭제되었습니다.');
                handleLogout();
                window.location.reload();
            }
        });

        function initAuthView() {
            if (currentUser) {
                document.getElementById('logged-out').classList.add('hidden');
                document.getElementById('logged-in').classList.remove('hidden');
                document.getElementById('user-welcome').innerText = `${currentUser.username}님`;
                document.getElementById('user-avatar').src = currentUser.avatar || 'https://via.placeholder.com/150';
            } else {
                document.getElementById('logged-out').classList.remove('hidden');
                document.getElementById('logged-in').classList.add('hidden');
            }
        }

        function openLoginModal() { document.getElementById('login-modal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('login-modal').classList.add('hidden'); }
        function openProfileModal() { document.getElementById('profile-modal').classList.remove('hidden'); }
        function closeProfileModal() { document.getElementById('profile-modal').classList.add('hidden'); }

        async function handleLogin() {
            const username = document.getElementById('modal-username').value.trim();
            const password = document.getElementById('modal-password').value.trim();
            if (!username || !password) return alert('닉네임과 비밀번호를 입력해주세요.');

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (data.success) {
                currentUser = data.user;
                localStorage.setItem('club_user_obj', JSON.stringify(currentUser));
                closeLoginModal();
                initAuthView();
                fetchInitialData();
            } else {
                alert(data.message);
            }
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('club_user_obj');
            initAuthView();
            fetchInitialData();
        }

        async function updateProfile() {
            const fileInput = document.getElementById('profile-img-input');
            if (!fileInput.files || !fileInput.files[0]) return alert('이미지를 선택해주세요.');

            const formData = new FormData();
            formData.append('username', currentUser.username);
            formData.append('avatar', fileInput.files[0]);

            const res = await fetch('/api/profile', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                currentUser.avatar = data.avatar;
                localStorage.setItem('club_user_obj', JSON.stringify(currentUser));
                closeProfileModal();
                initAuthView();
                fetchInitialData();
            } else {
                alert(data.message);
            }
        }

        async function fetchInitialData() {
            const resPosts = await fetch('/api/posts');
            const posts = await resPosts.json();
            renderFeed(posts);

            const resUsers = await fetch('/api/users');
            const users = await resUsers.json();
            renderUserList(users);
        }

        async function createPost() {
            if (!currentUser) {
                alert('로그인 후 업로드할 수 있습니다.');
                openLoginModal();
                return;
            }
            const title = document.getElementById('post-title').value.trim();
            const desc = document.getElementById('post-desc').value.trim();
            const imgInput = document.getElementById('post-img');
            const modelInput = document.getElementById('post-model');

            if (!title) return alert('제목을 입력해주세요.');

            const formData = new FormData();
            formData.append('author', currentUser.username);
            formData.append('title', title);
            formData.append('desc', desc);
            if (imgInput.files && imgInput.files[0]) formData.append('image', imgInput.files[0]);
            if (modelInput.files && modelInput.files[0]) formData.append('model', modelInput.files[0]);

            const res = await fetch('/api/posts', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                document.getElementById('post-title').value = '';
                document.getElementById('post-desc').value = '';
                document.getElementById('post-img').value = '';
                document.getElementById('post-model').value = '';
            } else {
                alert(data.message);
            }
        }

        async function deletePost(postId) {
            if (!currentUser) return;
            await fetch(`/api/posts/${postId}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username })
            });
        }

        async function togglePostLike(postId) {
            if (!currentUser) {
                alert('로그인이 필요합니다.');
                openLoginModal();
                return;
            }
            await fetch(`/api/posts/${postId}/like`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username })
            });
        }

        async function addComment(postId) {
            if (!currentUser) {
                alert('로그인이 필요합니다.');
                openLoginModal();
                return;
            }
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            await fetch(`/api/posts/${postId}/comments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ author: currentUser.username, text })
            });
            input.value = '';
        }

        async function deleteComment(postId, commentId) {
            if (!currentUser) return;
            await fetch(`/api/posts/${postId}/comments/${commentId}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username })
            });
        }

        async function toggleCommentLike(postId, commentId) {
            if (!currentUser) {
                alert('로그인이 필요합니다.');
                openLoginModal();
                return;
            }
            await fetch(`/api/posts/${postId}/comments/${commentId}/like`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username })
            });
        }

        async function deleteUser(targetUsername) {
            if (currentUser.username !== '이윤호') return;
            if (!confirm(`정말로 '${targetUsername}' 계정을 삭제하시겠습니까? 해당 유저의 글과 댓글이 모두 삭제됩니다.`)) return;

            await fetch(`/api/users/${encodeURIComponent(targetUsername)}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin: currentUser.username })
            });
            fetchInitialData();
        }

        // [추가] Three.js를 이용해 3D 모델(.glb/.gltf)을 화면에 렌더링하고 마우스로 돌려보게 만드는 함수
        function init3DViewer(containerId, modelUrl) {
            const container = document.getElementById(containerId);
            if (!container) return;

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a); // 배경색 맞춤 (slate-900)

            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 2, 5);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // 조명 추가
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            // 모델 로드
            const loader = new THREE.GLTFLoader();
            loader.load(modelUrl, (gltf) => {
                const model = gltf.scene;
                
                // 모델 크기 자동 조절 및 중앙 정렬
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 2 / maxDim;
                model.scale.set(scale, scale, scale);
                model.position.sub(center.multiplyScalar(scale));

                scene.add(model);
            }, undefined, (error) => {
                console.error('3D 모델 로드 실패:', error);
            });

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        }

        function renderFeed(posts) {
            const container = document.getElementById('feed-container');
            if (!posts || posts.length === 0) {
                container.innerHTML = `<div class="bg-slate-800 p-8 rounded-xl border border-slate-700 text-center text-slate-400 text-sm">등록된 작품이 없습니다.</div>`;
                return;
            }

            container.innerHTML = posts.map(p => {
                const likes = p.likes || [];
                const isPostLiked = currentUser && likes.includes(currentUser.username);
                const likeBtnColor = isPostLiked ? 'bg-red-500/20 text-red-400 border-red-500/50' : 'bg-slate-700 text-slate-300 border-slate-600';

                return `
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-3">
                    <div class="flex justify-between items-center text-xs text-slate-400">
                        <div class="flex items-center gap-2">
                            <span class="font-semibold text-cyan-400">${escapeStr(p.author)}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span>${p.date}</span>
                            ${(currentUser && (currentUser.username === p.author || currentUser.username === '이윤호')) ? `<button onclick="deletePost(${p.id})" class="text-red-400 hover:text-red-300 font-bold">삭제</button>` : ''}
                        </div>
                    </div>
                    <h3 class="text-base font-bold text-slate-100">${escapeStr(p.title)}</h3>
                    ${p.desc ? `<p class="text-sm text-slate-300 whitespace-pre-wrap">${escapeStr(p.desc)}</p>` : ''}
                    
                    <!-- 이미지 표시 -->
                    ${p.image ? `<div class="rounded-lg overflow-hidden border border-slate-700 bg-slate-900 max-h-80 flex justify-center"><img src="${p.image}" class="object-contain max-h-80"></div>` : ''}
                    
                    <!-- [추가] 3D 모델 뷰어 영역 -->
                    ${p.model ? `
                        <div class="space-y-1">
                            <div class="text-[11px] text-indigo-300 font-semibold">🧊 3D 모델 뷰어 (마우스로 돌려보세요)</div>
                            <div id="viewer-${p.id}" class="w-full h-64 rounded-lg overflow-hidden border border-slate-700 bg-slate-900 relative"></div>
                        </div>
                    ` : ''}
                    
                    <!-- 작품 좋아요 버튼 -->
                    <div class="flex items-center gap-2 pt-1">
                        <button onclick="togglePostLike(${p.id})" class="px-3 py-1.5 rounded-lg border text-xs font-semibold flex items-center gap-1.5 transition ${likeBtnColor}">
                            ❤️ 작품 좋아요 <span class="font-bold">${likes.length}</span>
                        </button>
                    </div>

                    <!-- 댓글 영역 -->
                    <div class="border-t border-slate-700 pt-3 mt-3 space-y-2">
                        <div class="text-xs font-semibold text-cyan-300">댓글 (${p.comments ? p.comments.length : 0})</div>
                        <div class="space-y-2 max-h-40 overflow-y-auto pr-1">
                            ${p.comments && p.comments.length > 0 ? p.comments.map(c => {
                                const cLikes = c.likes || [];
                                const isCommentLiked = currentUser && cLikes.includes(currentUser.username);
                                const commentLikeColor = isCommentLiked ? 'text-red-400 font-bold' : 'text-slate-400 hover:text-slate-200';

                                return `
                                <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-700 flex justify-between items-center text-xs">
                                    <div class="flex items-center gap-2.5 overflow-hidden">
                                        <img src="${c.avatar || 'https://via.placeholder.com/150'}" class="w-7 h-7 rounded-full object-cover border border-slate-700 flex-shrink-0">
                                        <div class="overflow-hidden">
                                            <div class="font-semibold text-cyan-400">${escapeStr(c.author)}</div>
                                            <div class="text-slate-200 break-words">${escapeStr(c.text)}</div>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-3 flex-shrink-0 ml-2">
                                        <button onclick="toggleCommentLike(${p.id},${c.id})" class="flex items-center gap-1 transition ${commentLikeColor}">
                                            👍 <span class="text-[11px]">${cLikes.length}</span>
                                        </button>
                                        <span class="text-[10px] text-slate-500">${c.date}</span>${(currentUser && (currentUser.username === c.author || currentUser.username === '이윤호')) ? `<button onclick="deleteComment(${p.id}, ${c.id})" class="text-red-400 hover:text-red-300 font-bold text-[10px]">삭제</button>` : ''}
                                    </div>
                                </div>
                                `;
                            }).join('') : '<div class="text-xs text-slate-500">아직 댓글이 없습니다.</div>'}
                        </div>
                        <div class="flex gap-2 mt-2">
                            <input type="text" id="comment-input-${p.id}" placeholder="댓글을 입력하세요..." class="flex-1 px-3 py-1 bg-slate-700 border border-slate-600 rounded text-xs text-white focus:outline-none focus:border-cyan-400">
                            <button onclick="addComment(${p.id})" class="px-3 py-1 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold rounded text-xs transition">등록</button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');

            // 렌더링 완료 후 3D 모델이 있는 게시글마다 뷰어 초기화 실행
            posts.forEach(p => {
                if (p.model) {
                    init3DViewer(`viewer-${p.id}`, p.model);
                }
            });
        }

        function renderUserList(users) {
            const container = document.getElementById('user-list-container');
            const isYunho = currentUser && currentUser.username === '이윤호';

            if (!users || users.length === 0) {
                container.innerHTML = `<div class="text-xs text-slate-500 text-center py-4">가입된 유저가 없습니다.</div>`;
                return;
            }

            container.innerHTML = users.map(u => `
                <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-700 flex justify-between items-center text-xs">
                    <div class="flex items-center gap-2">
                        <img src="${u.avatar || 'https://via.placeholder.com/150'}" class="w-6 h-6 rounded-full object-cover">
                        <div>
                            <span class="font-semibold text-cyan-300">${escapeStr(u.username)}</span>
                            ${isYunho ? `<span class="block text-[10px] text-slate-400">PW: ${escapeStr(u.password)}</span>` : ''}
                        </div>
                    </div>
                    ${isYunho ? `<button onclick="deleteUser('${u.username}')" class="px-2 py-1 bg-red-500/20 text-red-400 hover:bg-red-500/30 rounded text-[10px]">계정 삭제</button>` : ''}
                </div>
            `).join('');
        }

        function escapeStr(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
