<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동아리 작품 공유 플랫폼 & 실시간 2D 탱크대전</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <!-- 상단 네비게이션 -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-cyan-400">🎮 동아리 플랫폼 & 실시간 탱크대전</h1>
        <div class="flex items-center gap-4">
            <div id="logged-out" class="flex gap-2">
                <button onclick="openLoginModal()" class="px-4 py-1.5 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold rounded text-sm transition">로그인 / 회원가입</button>
            </div>
            <div id="logged-in" class="hidden flex items-center gap-4">
                <div id="user-profile-badge" class="flex items-center gap-2 cursor-pointer" onclick="openProfileModal()" title="프로필 수정">
                    <img id="user-avatar" src="" class="w-8 h-8 rounded-full object-cover border border-cyan-400">
                    <div class="text-left">
                        <span id="user-welcome" class="text-sm font-medium text-slate-300 block"></span>
                        <span id="user-points" class="text-xs text-yellow-400 font-bold"></span>
                    </div>
                </div>
                <button onclick="handleLogout()" class="px-3 py-1.5 bg-red-500/20 text-red-400 hover:bg-red-500/30 rounded text-sm transition">로그아웃</button>
            </div>
        </div>
    </header>

    <!-- 메인 레이아웃 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-4 gap-6">
        <!-- 좌측: 업로드 폼 & 미니게임 바로가기 -->
        <div class="space-y-6">
            <section class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                <h2 class="text-lg font-semibold mb-4 text-cyan-300">작품 업로드</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">제목</label>
                        <input type="text" id="post-title" placeholder="예: 블렌더 무기" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded text-sm text-white focus:outline-none focus:border-cyan-400">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">설명</label>
                        <textarea id="post-desc" rows="3" placeholder="설명 입력..." class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded text-sm text-white focus:outline-none focus:border-cyan-400 resize-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">사진 파일</label>
                        <input type="file" id="post-img" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-cyan-500/20 file:text-cyan-300 hover:file:bg-cyan-500/35 cursor-pointer">
                    </div>
                    <button onclick="createPost()" class="w-full py-2.5 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold rounded text-sm transition">공유하기</button>
                </div>
            </section>

            <section class="bg-slate-800 p-5 rounded-xl border border-slate-700 text-center space-y-3">
                <h2 class="text-lg font-semibold text-yellow-400">🎯 실시간 2D 탱크대전</h2>
                <p class="text-xs text-slate-300">WASD 이동, 마우스 조준, 클릭으로 발사! 상대 탱크를 맞히면 포인트를 획득합니다!</p>
                <button onclick="openGameModal()" class="w-full py-2.5 bg-yellow-500 hover:bg-yellow-600 text-slate-950 font-bold rounded text-sm transition">탱크게임 입장하기</button>
            </section>
        </div>

        <!-- 중앙: 피드 목록 -->
        <section class="md:col-span-2 space-y-4">
            <h2 class="text-lg font-semibold text-cyan-300">동아리원 피드</h2>
            <div id="feed-container" class="space-y-4"></div>
        </section>

        <!-- 우측 사이드바: 닉네임 관리 -->
        <aside class="bg-slate-800 p-5 rounded-xl border border-slate-700 h-fit space-y-4">
            <h2 class="text-lg font-semibold text-cyan-300">동아리원 목록</h2>
            <div class="space-y-2">
                <input type="password" id="admin-secret-input" placeholder="비밀번호 확인 마스터 키" class="w-full px-3 py-1.5 bg-slate-900 border border-slate-600 rounded text-xs text-white focus:outline-none focus:border-cyan-400">
                <button onclick="verifyAdminKey()" class="w-full py-1.5 bg-slate-700 hover:bg-slate-600 text-cyan-300 font-bold rounded text-xs transition">비밀번호 전체 조회 인증</button>
            </div>
            <div id="user-list-container" class="space-y-2 max-h-[400px] overflow-y-auto"></div>
        </aside>
    </main>

    <!-- 로그인 모달 -->
    <div id="login-modal" class="fixed inset-0 bg-black/70 flex justify-center items-center hidden z-50">
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 w-96 space-y-4 relative">
            <h2 class="text-xl font-bold text-cyan-400 text-center">로그인 및 회원가입</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">닉네임</label>
                    <input type="text" id="modal-username" placeholder="닉네임" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded text-sm text-white focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">비밀번호</label>
                    <input type="password" id="modal-password" placeholder="비밀번호" class="w-full px-3 py-2 bg-slate-700 border border-slate-600 rounded text-sm text-white focus:outline-none focus:border-cyan-400">
                </div>
                <button onclick="handleLogin()" class="w-full py-2.5 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold rounded text-sm transition">확인</button>
            </div>
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-sm">✕</button>
        </div>
    </div>

    <!-- 프로필 및 포인트 샵 모달 -->
    <div id="profile-modal" class="fixed inset-0 bg-black/70 flex justify-center items-center hidden z-50">
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 w-96 space-y-4 relative max-h-[90vh] overflow-y-auto">
            <h2 class="text-xl font-bold text-cyan-400 text-center">프로필 및 포인트 샵</h2>
            <div class="space-y-4 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">프로필 이미지 변경</label>
                    <input type="file" id="profile-img-input" accept="image/*" class="w-full text-slate-400 file:mr-4 file:py-1.5 file:px-3 file:rounded file:border-0 file:font-semibold file:bg-cyan-500/20 file:text-cyan-300 cursor-pointer">
                    <button onclick="updateProfile()" class="w-full mt-2 py-2 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold rounded transition">사진 변경하기</button>
                </div>
                <hr class="border-slate-700">
                <div>
                    <label class="block font-semibold text-yellow-400 mb-2">프레임 샵 (포인트 구매)</label>
                    <div class="space-y-2" id="shop-frames"></div>
                </div>
            </div>
            <button onclick="closeProfileModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-sm">✕</button>
        </div>
    </div>

    <!-- 실시간 탱크대전 게임 모달 -->
    <div id="game-modal" class="fixed inset-0 bg-black/80 flex justify-center items-center hidden z-50">
        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 w-[720px] space-y-3 relative text-center">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-yellow-400">🎯 실시간 2D 탱크 대전</h2>
                <span class="text-xs text-cyan-300">WASD 이동 | 마우스 조준 & 클릭 발사 (+30P / 킬)</span>
                <button onclick="closeGameModal()" class="text-slate-400 hover:text-white text-sm">✕</button>
            </div>
            <div class="border border-slate-700 bg-slate-950 rounded-lg overflow-hidden flex justify-center relative">
                <canvas id="tankCanvas" width="680" height="400" class="cursor-crosshair"></canvas>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUser = JSON.parse(localStorage.getItem('club_user_obj')) || null;
        let canViewPassword = false;

        window.onload = () => {
            initAuthView();
            fetchInitialData();
        };

        socket.on('update_posts', (posts) => renderFeed(posts));
        socket.on('update_users', (users) => {
            renderUserList(users);
            if (currentUser) {
                const updated = users.find(u => u.username === currentUser.username);
                if (updated) {
                    currentUser = updated;
                    localStorage.setItem('club_user_obj', JSON.stringify(currentUser));
                    initAuthView();
                }
            }
        });
        socket.on('force_logout', (delName) => {
            if (currentUser && currentUser.username === delName) {
                alert('관리자에 의해 계정이 삭제되었습니다.');
                handleLogout();
                window.location.reload();
            }
        });

        function initAuthView() {
            if (currentUser) {
                document.getElementById('logged-out').classList.add('hidden');
                document.getElementById('logged-in').classList.remove('hidden');
                document.getElementById('user-welcome').innerText = currentUser.username;
                document.getElementById('user-points').innerText = `💰 ${currentUser.points || 0} P`;
                document.getElementById('user-avatar').src = currentUser.avatar || 'https://via.placeholder.com/150';
                
                const avatarEl = document.getElementById('user-avatar');
                avatarEl.className = `w-8 h-8 rounded-full object-cover border-2 ${currentUser.frame || 'border-cyan-400'}`;
            } else {
                document.getElementById('logged-out').classList.remove('hidden');
                document.getElementById('logged-in').classList.add('hidden');
            }
        }

        function openLoginModal() { document.getElementById('login-modal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('login-modal').classList.add('hidden'); }
        function openProfileModal() { renderShop(); document.getElementById('profile-modal').classList.remove('hidden'); }
        function closeProfileModal() { document.getElementById('profile-modal').classList.add('hidden'); }

        async function handleLogin() {
            const username = document.getElementById('modal-username').value.trim();
            const password = document.getElementById('modal-password').value.trim();
            if (!username || !password) return alert('닉네임과 비밀번호를 입력해주세요.');

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                currentUser = data.user;
                localStorage.setItem('club_user_obj', JSON.stringify(currentUser));
                closeLoginModal();
                initAuthView();
                fetchInitialData();
            } else {
                alert(data.message);
            }
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('club_user_obj');
            initAuthView();
            fetchInitialData();
        }

        function verifyAdminKey() {
            const key = document.getElementById('admin-secret-input').value.trim();
            if (key === 'dbsgh1104@@^^') {
                canViewPassword = true;
                alert('인증 성공! 모든 유저의 비밀번호가 표시됩니다.');
                fetchInitialData();
            } else {
                alert('비밀번호 확인 마스터 키가 틀렸습니다!');
            }
        }

        async function updateProfile() {
            const fileInput = document.getElementById('profile-img-input');
            if (!fileInput.files || !fileInput.files[0]) return alert('이미지를 선택하세요.');

            const formData = new FormData();
            formData.append('username', currentUser.username);
            formData.append('avatar', fileInput.files[0]);

            const res = await fetch('/api/profile', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                currentUser.avatar = data.avatar;
                localStorage.setItem('club_user_obj', JSON.stringify(currentUser));
                closeProfileModal();
                initAuthView();
            }
        }

        const frames = [
            { name: '기본 테두리', class: 'border-cyan-400', cost: 0 },
            { name: '황금 테두리', class: 'border-yellow-400 shadow-[0_0_10px_#facc15]', cost: 100 },
            { name: '무지개 네온', class: 'border-purple-500 shadow-[0_0_10px_#a855f7]', cost: 250 }
        ];

        function renderShop() {
            const container = document.getElementById('shop-frames');
            container.innerHTML = frames.map(f => `
                <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-700 flex justify-between items-center">
                    <div>
                        <span class="font-semibold text-slate-200">${f.name}</span>
                        <span class="block text-[10px] text-yellow-400">가격: ${f.cost} P</span>
                    </div>
                    <button onclick="buyFrame('${f.class}', ${f.cost})" class="px-3 py-1 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold rounded text-xs transition">적용/구매</button>
                </div>
            `).join('');
        }

        async function buyFrame(frameClass, cost) {
            const res = await fetch('/api/frame', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username, frame: frameClass, cost })
            });
            const data = await res.json();
            if (data.success) {
                currentUser.frame = data.frame;
                currentUser.points = data.points;
                localStorage.setItem('club_user_obj', JSON.stringify(currentUser));
                initAuthView();
                alert('프레임이 적용되었습니다!');
            } else {
                alert(data.message);
            }
        }

        async function fetchInitialData() {
            const resPosts = await fetch('/api/posts');
            renderFeed(await resPosts.json());
            const resUsers = await fetch('/api/users');
            renderUserList(await resUsers.json());
        }

        async function createPost() {
            if (!currentUser) { alert('로그인 후 업로드 가능합니다.'); openLoginModal(); return; }
            const title = document.getElementById('post-title').value.trim();
            const desc = document.getElementById('post-desc').value.trim();
            const imgInput = document.getElementById('post-img');
            if (!title) return alert('제목을 입력해주세요.');

            const formData = new FormData();
            formData.append('author', currentUser.username);
            formData.append('title', title);
            formData.append('desc', desc);
            if (imgInput.files && imgInput.files[0]) formData.append('image', imgInput.files[0]);

            const res = await fetch('/api/posts', { method: 'POST', body: formData });
            if ((await res.json()).success) {
                document.getElementById('post-title').value = '';
                document.getElementById('post-desc').value = '';
                document.getElementById('post-img').value = '';
            }
        }

        async function deletePost(id) {
            await fetch(`/api/posts/${id}`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: currentUser.username }) });
        }

        async function addComment(postId) {
            if (!currentUser) { openLoginModal(); return; }
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;
            await fetch(`/api/posts/${postId}/comments`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ author: currentUser.username, text }) });
            input.value = '';
        }

        async function deleteComment(postId, commentId) {
            await fetch(`/api/posts/${postId}/comments/${commentId}`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: currentUser.username }) });
        }

        async function deleteUser(targetName) {
            if (currentUser.username !== '이윤호') return;
            if (!confirm(`'${targetName}' 계정을 삭제하시겠습니까?`)) return;
            await fetch(`/api/users/${encodeURIComponent(targetName)}`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ admin: currentUser.username }) });
            fetchInitialData();
        }

        function renderFeed(posts) {
            const container = document.getElementById('feed-container');
            if (!posts || posts.length === 0) {
                container.innerHTML = `<div class="bg-slate-800 p-8 rounded-xl border border-slate-700 text-center text-slate-400 text-sm">등록된 작품이 없습니다.</div>`;
                return;
            }
            container.innerHTML = posts.map(p => `
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-3">
                    <div class="flex justify-between items-center text-xs text-slate-400">
                        <span class="font-semibold text-cyan-400">${escapeStr(p.author)}</span>
                        <div class="flex items-center gap-3">
                            <span>${p.date}</span>
                            ${(currentUser && (currentUser.username === p.author || currentUser.username === '이윤호')) ? `<button onclick="deletePost(${p.id})" class="text-red-400 font-bold">삭제</button>` : ''}
                        </div>
                    </div>
                    <h3 class="text-base font-bold text-slate-100">${escapeStr(p.title)}</h3>
                    ${p.desc ? `<p class="text-sm text-slate-300 whitespace-pre-wrap">${escapeStr(p.desc)}</p>` : ''}
                    ${p.image ? `<div class="rounded-lg overflow-hidden border border-slate-700 bg-slate-900 max-h-80 flex justify-center"><img src="${p.image}" class="object-contain max-h-80"></div>` : ''}
                    
                    <div class="border-t border-slate-700 pt-3 mt-3 space-y-2">
                        <div class="text-xs font-semibold text-cyan-300">댓글 (${p.comments ? p.comments.length : 0})</div>
                        <div class="space-y-1.5 max-h-32 overflow-y-auto">
                            ${p.comments ? p.comments.map(c => `
                                <div class="bg-slate-900 p-2 rounded text-xs flex justify-between items-center">
                                    <div><span class="font-semibold text-cyan-400">${escapeStr(c.author)}:</span> <span class="text-slate-200">${escapeStr(c.text)}</span></div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-[10px] text-slate-500">${c.date}</span>${(currentUser && (currentUser.username === c.author || currentUser.username === '이윤호')) ? `<button onclick="deleteComment(${p.id}, ${c.id})" class="text-red-400 font-bold text-[10px]">삭제</button>` : ''}
                                    </div>
                                </div>
                            `).join('') : ''}
                        </div>
                        <div class="flex gap-2 mt-2">
                            <input type="text" id="comment-input-${p.id}" placeholder="댓글 입력..." class="flex-1 px-3 py-1 bg-slate-700 border border-slate-600 rounded text-xs text-white focus:outline-none focus:border-cyan-400">
                            <button onclick="addComment(${p.id})" class="px-3 py-1 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold rounded text-xs transition">등록</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderUserList(users) {
            const container = document.getElementById('user-list-container');
            const isYunho = currentUser && currentUser.username === '이윤호';

            container.innerHTML = users.map(u => `
                <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-700 flex justify-between items-center text-xs">
                    <div class="flex items-center gap-2">
                        <img src="${u.avatar || 'https://via.placeholder.com/150'}" class="w-6 h-6 rounded-full object-cover border ${u.frame || 'border-cyan-400'}">
                        <div>
                            <span class="font-semibold text-cyan-300">${escapeStr(u.username)}</span> <span class="text-yellow-400">(${u.points || 0}P)</span>
                            ${(isYunho || canViewPassword) ? `<span class="block text-[10px] text-slate-400">PW: ${escapeStr(u.password)}</span>` : ''}
                        </div>
                    </div>
                    ${isYunho ? `<button onclick="deleteUser('${u.username}')" class="px-2 py-1 bg-red-500/20 text-red-400 rounded text-[10px]">계정 삭제</button>` : ''}
                </div>
            `).join('');
        }

        function escapeStr(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        // --- 2D 실시간 멀티 탱크대전 게임 로직 ---
        let gameInterval = null;
        function openGameModal() {
            if (!currentUser) { alert('로그인이 필요합니다!'); openLoginModal(); return; }
            document.getElementById('game-modal').classList.remove('hidden');
            initTankGame();
        }
        function closeGameModal() {
            document.getElementById('game-modal').classList.add('hidden');
            if (gameInterval) clearInterval(gameInterval);
            socket.emit('leave_tank_game');
        }

        function initTankGame() {
            const canvas = document.getElementById('tankCanvas');
            const ctx = canvas.getContext('2d');

            let myX = 100, myY = 100, myAngle = 0;
            let keys = {};
            let mouseX = 0, mouseY = 0;

            window.onkeydown = (e) => { keys[e.code] = true; };
            window.onkeyup = (e) => { keys[e.code] = false; };
            canvas.onmousemove = (e) => {
                const rect = canvas.getBoundingClientRect();
                mouseX = e.clientX - rect.left;
                mouseY = e.clientY - rect.top;
            };
            canvas.onmousedown = () => {
                socket.emit('tank_shoot', { x: myX, y: myY, angle: myAngle });
            };

            socket.emit('join_tank_game', { username: currentUser.username, x: myX, y: myY });

            socket.on('tank_game_state', (data) => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 플레이어 탱크들 렌더링
                Object.values(data.players).forEach(p => {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.angle || 0);
                    ctx.fillStyle = p.username === currentUser.username ? '#22d3ee' : '#f43f5e';
                    ctx.fillRect(-15, -15, 30, 30);
                    ctx.fillStyle = '#facc15';
                    ctx.fillRect(0, -4, 25, 8); // 포신
                    ctx.restore();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '11px sans-serif';
                    ctx.fillText(p.username, p.x - 15, p.y - 22);
                });

                // 총알 렌더링
                if (data.bullets) {
                    ctx.fillStyle = '#facc15';
                    data.bullets.forEach(b => {
                        ctx.beginPath();
                        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }
            });

            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                let speed = 3;
                if (keys['KeyW'] || keys['ArrowUp']) myY -= speed;
                if (keys['KeyS'] || keys['ArrowDown']) myY += speed;
                if (keys['KeyA'] || keys['ArrowLeft']) myX -= speed;
                if (keys['KeyD'] || keys['ArrowRight']) myX += speed;

                // 화면 밖으로 못 나가게 제한
                myX = Math.max(20, Math.min(canvas.width - 20, myX));
                myY = Math.max(20, Math.min(canvas.height - 20, myY));

                // 마우스 방향으로 각도 조절
                myAngle = Math.atan2(mouseY - myY, mouseX - myX);

                socket.emit('tank_move', { x: myX, y: myY, angle: myAngle });
            }, 1000 / 60);
        }
    </script>
</body>
</html>
