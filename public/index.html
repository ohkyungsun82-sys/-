<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테크 & 동아리 기술 블로그</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
    <!-- 상단 네비게이션바 -->
    <header class="bg-slate-900 border-b border-slate-800 px-8 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <span class="text-xl font-black text-cyan-400 tracking-wider">DEV.LOG</span>
            <span class="text-xs text-slate-400 border-l border-slate-700 pl-3">동아리 기술 및 개발 아카이브</span>
        </div>
        <div class="flex items-center gap-4">
            <div id="logged-out" class="flex gap-2">
                <button onclick="openLoginModal()" class="px-4 py-2 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold rounded-lg text-xs transition">로그인 / 회원가입</button>
            </div>
            <div id="logged-in" class="hidden flex items-center gap-4">
                <div class="flex items-center gap-2 cursor-pointer" onclick="openProfileModal()" title="프로필 설정">
                    <img id="user-avatar" src="" class="w-8 h-8 rounded-full object-cover border border-cyan-500">
                    <div class="text-left">
                        <span id="user-welcome" class="text-xs font-semibold text-slate-200 block"></span>
                        <span id="user-points" class="text-[10px] text-yellow-400 font-bold"></span>
                    </div>
                </div>
                <button onclick="handleLogout()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs transition border border-slate-700">로그아웃</button>
            </div>
        </div>
    </header>

    <!-- 메인 레이아웃 -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-4 gap-8">
        <!-- 좌측: 글 작성 포스팅 폼 -->
        <section class="bg-slate-900 p-6 rounded-xl border border-slate-800 h-fit space-y-4 shadow-xl">
            <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-widest border-b border-slate-800 pb-2">새 포스트 작성</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">포스트 제목</label>
                    <input type="text" id="post-title" placeholder="예: 블렌더 3D 모델링 최적화 기법" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs text-white focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text--[11px] text-slate-400 mb-1">기술 내용 및 본문</label>
                    <textarea id="post-desc" rows="5" placeholder="마크다운 스타일로 기술적 인사이트를 공유해보세요." class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs text-white focus:outline-none focus:border-cyan-500 resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-[11px] text-slate-400 mb-1">참조 이미지 첨부</label>
                    <input type="file" id="post-img" accept="image/*" class="w-full text-[11px] text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:font-semibold file:bg-cyan-500/10 file:text-cyan-400 hover:file:bg-cyan-500/20 cursor-pointer">
                </div>
                <button onclick="createPost()" class="w-full py-2.5 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold rounded-lg text-xs transition">포스트 발행</button>
            </div>
        </section>

        <!-- 중앙: 블로그 피드 아카이브 -->
        <section class="md:col-span-2 space-y-6">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h2 class="text-sm font-bold text-slate-300 uppercase tracking-widest">기술 아카이브 피드</h2>
                <span class="text-xs text-slate-500">실시간 동기화됨</span>
            </div>
            <div id="feed-container" class="space-y-6"></div>
        </section>

        <!-- 우측 사이드바: 멤버 관리 및 보안 인증 -->
        <aside class="bg-slate-900 p-6 rounded-xl border border-slate-800 h-fit space-y-5 shadow-xl">
            <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-widest border-b border-slate-800 pb-2">Contributors</h2>
            <div class="space-y-2">
                <input type="password" id="admin-secret-input" placeholder="마스터 보안 키 입력" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs text-white focus:outline-none focus:border-cyan-500">
                <button onclick="verifyAdminKey()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-cyan-400 font-bold rounded-lg text-xs transition border border-slate-700">비밀번호 권한 인증</button>
            </div>
            <div id="user-list-container" class="space-y-2.5 max-h-[450px] overflow-y-auto"></div>
        </aside>
    </main>

    <!-- 로그인 모달 -->
    <div id="login-modal" class="fixed inset-0 bg-black/80 flex justify-center items-center hidden z-50 backdrop-blur-sm">
        <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 w-96 space-y-5 relative shadow-2xl">
            <h2 class="text-lg font-bold text-cyan-400 text-center tracking-wide">Developer Authentication</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">사용자명 (ID)</label>
                    <input type="text" id="modal-username" placeholder="닉네임 입력" class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-white focus:outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">비밀번호 (Password)</label>
                    <input type="password" id="modal-password" placeholder="비밀번호 입력" class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-white focus:outline-none focus:border-cyan-500">
                </div>
                <button onclick="handleLogin()" class="w-full py-2.5 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold rounded-lg text-xs transition">인증 및 접속</button>
            </div>
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-slate-500 hover:text-white text-xs">✕</button>
        </div>
    </div>

    <!-- 프로필 설정 및 포인트 스토어 모달 -->
    <div id="profile-modal" class="fixed inset-0 bg-black/80 flex justify-center items-center hidden z-50 backdrop-blur-sm">
        <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 w-96 space-y-5 relative shadow-2xl max-h-[90vh] overflow-y-auto">
            <h2 class="text-lg font-bold text-cyan-400 text-center tracking-wide">프로필 및 배지 커스텀</h2>
            <div class="space-y-4 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">프로필 아바타 교체</label>
                    <input type="file" id="profile-img-input" accept="image/*" class="w-full text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:font-semibold file:bg-cyan-500/10 file:text-cyan-400 cursor-pointer">
                    <button onclick="updateProfile()" class="w-full mt-2 py-2 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold rounded-lg transition">이미지 업로드</button>
                </div>
                <hr class="border-slate-800">
                <div>
                    <label class="block font-semibold text-yellow-400 mb-2">프레임 스토어 (활동 포인트 구매)</label>
                    <div class="space-y-2" id="shop-frames"></div>
                </div>
            </div>
            <button onclick="closeProfileModal()" class="absolute top-4 right-4 text-slate-500 hover:text-white text-xs">✕</button>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUser = JSON.parse(localStorage.getItem('club_user_obj')) || null;
        let canViewPassword = false;

        window.onload = () => {
            initAuthView();
            fetchInitialData();
        };

        socket.on('update_posts', (posts) => renderFeed(posts));
        socket.on('update_users', (users) => {
            renderUserList(users);
            if (currentUser) {
                const updated = users.find(u => u.username === currentUser.username);
                if (updated) {
                    currentUser = updated;
                    localStorage.setItem('club_user_obj', JSON.stringify(currentUser));
                    initAuthView();
                }
            }
        });
        socket.on('force_logout', (delName) => {
            if (currentUser && currentUser.username === delName) {
                alert('관리자에 의해 계정이 삭제되었습니다.');
                handleLogout();
                window.location.reload();
            }
        });

        function initAuthView() {
            if (currentUser) {
                document.getElementById('logged-out').classList.add('hidden');
                document.getElementById('logged-in').classList.remove('hidden');
                document.getElementById('user-welcome').innerText = currentUser.username;
                document.getElementById('user-points').innerText = `✨ ${currentUser.points || 0} pts`;
                document.getElementById('user-avatar').src = currentUser.avatar || 'https://via.placeholder.com/150';
                
                const avatarEl = document.getElementById('user-avatar');
                avatarEl.className = `w-8 h-8 rounded-full object-cover border-2 ${currentUser.frame || 'border-cyan-500'}`;
            } else {
                document.getElementById('logged-out').classList.remove('hidden');
                document.getElementById('logged-in').classList.add('hidden');
            }
        }

        function openLoginModal() { document.getElementById('login-modal').classList.remove('hidden'); }
        function closeLoginModal() { document.getElementById('login-modal').classList.add('hidden'); }
        function openProfileModal() { renderShop(); document.getElementById('profile-modal').classList.remove('hidden'); }
        function closeProfileModal() { document.getElementById('profile-modal').classList.add('hidden'); }

        async function handleLogin() {
            const username = document.getElementById('modal-username').value.trim();
            const password = document.getElementById('modal-password').value.trim();
            if (!username || !password) return alert('닉네임과 비밀번호를 입력해주세요.');

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                currentUser = data.user;
                localStorage.setItem('club_user_obj', JSON.stringify(currentUser));
                closeLoginModal();
                initAuthView();
                fetchInitialData();
            } else {
                alert(data.message);
            }
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('club_user_obj');
            initAuthView();
            fetchInitialData();
        }

        function verifyAdminKey() {
            const key = document.getElementById('admin-secret-input').value.trim();
            if (key === 'dbsgh1104@@^^') {
                canViewPassword = true;
                alert('보안 인증 성공. 모든 계정의 비밀번호가 노출됩니다.');
                fetchInitialData();
            } else {
                alert('마스터 보안 키가 일치하지 않습니다.');
            }
        }

        async function updateProfile() {
            const fileInput = document.getElementById('profile-img-input');
            if (!fileInput.files || !fileInput.files[0]) return alert('이미지를 선택해주세요.');

            const formData = new FormData();
            formData.append('username', currentUser.username);
            formData.append('avatar', fileInput.files[0]);

            const res = await fetch('/api/profile', { method: 'POST', body: formData });
            const data = await res.json();
            if (data.success) {
                currentUser.avatar = data.avatar;
                localStorage.setItem('club_user_obj', JSON.stringify(currentUser));
                closeProfileModal();
                initAuthView();
            }
        }

        const frames = [
            { name: '스탠다드 테두리', class: 'border-cyan-500', cost: 0 },
            { name: '엘리트 골드', class: 'border-yellow-400 shadow-[0_0_12px_#facc15]', cost: 100 },
            { name: '사이버 펑크 네온', class: 'border-purple-500 shadow-[0_0_12px_#a855f7]', cost: 250 }
        ];

        function renderShop() {
            const container = document.getElementById('shop-frames');
            container.innerHTML = frames.map(f => `
                <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 flex justify-between items-center">
                    <div>
                        <span class="font-semibold text-slate-200 block">${f.name}</span>
                        <span class="text-[10px] text-yellow-400">비용: ${f.cost} pts</span>
                    </div>
                    <button onclick="buyFrame('${f.class}', ${f.cost})" class="px-3 py-1 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold rounded transition text-[11px]">구매/적용</button>
                </div>
            `).join('');
        }

        async function buyFrame(frameClass, cost) {
            const res = await fetch('/api/frame', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: currentUser.username, frame: frameClass, cost })
            });
            const data = await res.json();
            if (data.success) {
                currentUser.frame = data.frame;
                currentUser.points = data.points;
                localStorage.setItem('club_user_obj', JSON.stringify(currentUser));
                initAuthView();
                alert('스타일이 성공적으로 적용되었습니다.');
            } else {
                alert(data.message);
            }
        }

        async function fetchInitialData() {
            const resPosts = await fetch('/api/posts');
            renderFeed(await resPosts.json());
            const resUsers = await fetch('/api/users');
            renderUserList(await resUsers.json());
        }

        async function createPost() {
            if (!currentUser) { alert('로그인이 필요합니다.'); openLoginModal(); return; }
            const title = document.getElementById('post-title').value.trim();
            const desc = document.getElementById('post-desc').value.trim();
            const imgInput = document.getElementById('post-img');
            if (!title) return alert('포스트 제목을 입력해주세요.');

            const formData = new FormData();
            formData.append('author', currentUser.username);
            formData.append('title', title);
            formData.append('desc', desc);
            if (imgInput.files && imgInput.files[0]) formData.append('image', imgInput.files[0]);

            const res = await fetch('/api/posts', { method: 'POST', body: formData });
            if ((await res.json()).success) {
                document.getElementById('post-title').value = '';
                document.getElementById('post-desc').value = '';
                document.getElementById('post-img').value = '';
            }
        }

        async function deletePost(id) {
            await fetch(`/api/posts/${id}`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: currentUser.username }) });
        }

        async function addComment(postId) {
            if (!currentUser) { openLoginModal(); return; }
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;
            await fetch(`/api/posts/${postId}/comments`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ author: currentUser.username, text }) });
            input.value = '';
        }

        async function deleteComment(postId, commentId) {
            await fetch(`/api/posts/${postId}/comments/${commentId}`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: currentUser.username }) });
        }

        async function deleteUser(targetName) {
            if (currentUser.username !== '이윤호') return;
            if (!confirm(`'${targetName}' 계정을 영구 삭제하시겠습니까? 관련 데이터가 모두 소멸합니다.`)) return;
            await fetch(`/api/users/${encodeURIComponent(targetName)}`, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ admin: currentUser.username }) });
            fetchInitialData();
        }

        function renderFeed(posts) {
            const container = document.getElementById('feed-container');
            if (!posts || posts.length === 0) {
                container.innerHTML = `<div class="bg-slate-900 p-8 rounded-xl border border-slate-800 text-center text-slate-500 text-xs">등록된 포스트가 없습니다. 첫 기술 아카이브를 작성해보세요.</div>`;
                return;
            }
            container.innerHTML = posts.map(p => `
                <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 space-y-4 shadow-lg">
                    <div class="flex justify-between items-center text-xs text-slate-400 border-b border-slate-800 pb-3">
                        <span class="font-bold text-cyan-400">@${escapeStr(p.author)}</span>
                        <div class="flex items-center gap-3">
                            <span class="text-[11px] text-slate-500">${p.date}</span>
                            ${(currentUser && (currentUser.username === p.author || currentUser.username === '이윤호')) ? `<button onclick="deletePost(${p.id})" class="text-red-400 hover:text-red-300 font-bold text-[11px]">삭제</button>` : ''}
                        </div>
                    </div>
                    <h3 class="text-base font-bold text-slate-100 tracking-tight">${escapeStr(p.title)}</h3>
                    ${p.desc ? `<p class="text-xs text-slate-300 whitespace-pre-wrap leading-relaxed font-mono bg-slate-950 p-3 rounded-lg border border-slate-800/80">${escapeStr(p.desc)}</p>` : ''}
                    ${p.image ? `<div class="rounded-lg overflow-hidden border border-slate-800 bg-slate-950 flex justify-center"><img src="${p.image}" class="object-contain max-h-80"></div>` : ''}
                    
                    <div class="border-t border-slate-800 pt-3 space-y-2.5">
                        <div class="text-[11px] font-semibold text-cyan-400 uppercase tracking-wider">Discussion (${p.comments ? p.comments.length : 0})</div>
                        <div class="space-y-2 max-h-40 overflow-y-auto">
                            ${p.comments ? p.comments.map(c => `
                                <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-xs flex justify-between items-center">
                                    <div><span class="font-semibold text-cyan-400">@${escapeStr(c.author)}:</span> <span class="text-slate-300">${escapeStr(c.text)}</span></div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-[10px] text-slate-600">${c.date}</span>${(currentUser && (currentUser.username === c.author || currentUser.username === '이윤호')) ? `<button onclick="deleteComment(${p.id}, ${c.id})" class="text-red-400 font-bold text-[10px]">삭제</button>` : ''}
                                    </div>
                                </div>
                            `).join('') : ''}
                        </div>
                        <div class="flex gap-2 pt-1">
                            <input type="text" id="comment-input-${p.id}" placeholder="피드백이나 의견을 남겨주세요..." class="flex-1 px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-white focus:outline-none focus:border-cyan-500">
                            <button onclick="addComment(${p.id})" class="px-4 py-1.5 bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-bold rounded-lg text-xs transition">작성</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderUserList(users) {
            const container = document.getElementById('user-list-container');
            const isYunho = currentUser && currentUser.username === '이윤호';

            container.innerHTML = users.map(u => `
                <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 flex justify-between items-center text-xs">
                    <div class="flex items-center gap-2.5">
                        <img src="${u.avatar || 'https://via.placeholder.com/150'}" class="w-7 h-7 rounded-full object-cover border ${u.frame || 'border-cyan-500'}">
                        <div>
                            <span class="font-bold text-slate-200 block">@${escapeStr(u.username)}</span>
                            <span class="text-[10px] text-yellow-400 font-medium">${u.points || 0} pts</span>
                            ${(isYunho || canViewPassword) ? `<span class="block text-[10px] text-slate-400 font-mono">PW: ${escapeStr(u.password)}</span>` : ''}
                        </div>
                    </div>
                    ${isYunho ? `<button onclick="deleteUser('${u.username}')" class="px-2.5 py-1 bg-red-500/10 text-red-400 hover:bg-red-500/20 rounded text-[10px] border border-red-500/20 transition">계정 삭제</button>` : ''}
                </div>
            `).join('');
        }

        function escapeStr(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
